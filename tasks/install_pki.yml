---
# pki_files: existing slurp results (item = basename, content = base64).
# pki_names: optional basenames; defaults to pki_files' names.
# pki_in_place: signing has already modified this node's live PKI files.
# Compare pre-signing and current hashes, using pki_snapshot.yml before signing.
# An in-place caller owns rescue (pki_restore.yml) and backup cleanup; otherwise
# this file owns the snapshot, restoration and cleanup for this installation.
- name: Manage PKI installation
  become: true
  vars:
    pki_service: "{{ 'lighthouse' if inventory_hostname in groups['nebula_lighthouse'] else 'nebula' }}"
    pki_install_names: "{{ pki_names if pki_names is defined else pki_files | map(attribute='item') | list }}"
  block:
    - name: Snapshot PKI before installation
      include_tasks: pki_snapshot.yml
      when: not pki_in_place | default(false)

    - name: Inspect in-place PKI metadata
      stat:
        path: "{{ nebula_config_dir }}/{{ item }}"
      loop: "{{ pki_install_names }}"
      register: pki_after
      no_log: true
      when: pki_in_place | default(false)

    - name: Identify changed files without copying key content
      set_fact:
        pki_changed: "{{ pki_changed + [item.item] }}"
      loop: "{{ pki_before.results }}"
      when: >-
        (item.stat.checksum | default('')) !=
        ((pki_after.results | selectattr('item', 'equalto', item.item) | first).stat.checksum | default('')
        if pki_in_place | default(false) else
        ((pki_files | selectattr('item', 'equalto', item.item) | first).content | b64decode | hash('sha1')))
      no_log: true

    - name: Apply PKI transaction
      block:
        - name: Back up changed PKI before installation
          include_tasks: pki_backup.yml
          when: not ansible_check_mode and pki_process.rc == 0 and pki_changed | length > 0 and not pki_in_place | default(false)

        - name: Install PKI files as a set
          copy:
            dest: "{{ nebula_config_dir }}/{{ item.item }}"
            content: "{{ item.content | b64decode }}"
            owner: root
            group: root
            mode: '0600'
          loop: "{{ pki_files | default([]) }}"
          no_log: true

        - name: Validate and activate changed PKI
          when: not ansible_check_mode and pki_process.rc == 0 and pki_changed | length > 0
          block:
            - name: Verify node certificate against the CA bundle
              command: {argv: ["{{ nebula_config_dir }}/nebula-cert", verify, -ca, "{{ nebula_config_dir }}/ca.crt", -crt, "{{ nebula_config_dir }}/{{ nebula_lighthouse_hostname if inventory_hostname in groups['nebula_lighthouse'] else inventory_hostname }}.crt"]}
              changed_when: false

            - name: Validate complete PKI set
              command: {argv: ["{{ nebula_config_dir }}/nebula", -test, -config, "{{ nebula_config_dir }}/config.yml"]}
              changed_when: false

            - name: Record journal cursor when available
              shell: "if command -v journalctl >/dev/null; then journalctl -u {{ pki_service | quote }} -n 0 --show-cursor --no-pager; fi"
              register: pki_cursor
              changed_when: false

            - name: Read expected public certificate fingerprint
              command: {argv: ["{{ nebula_config_dir }}/nebula-cert", print, -path, "{{ nebula_config_dir }}/{{ nebula_lighthouse_hostname if inventory_hostname in groups['nebula_lighthouse'] else inventory_hostname }}.crt"]}
              register: pki_certificate
              changed_when: false

            - name: Reload PKI without restarting
              systemd: {name: "{{ pki_service }}", state: reloaded}

            - name: Verify reload logs and process identity
              shell: |
                set -eu
                sleep 1
                test {{ (pki_process.stdout_lines | last | int) }} -gt 0
                test "$(systemctl is-active {{ pki_service | quote }}; systemctl show {{ pki_service | quote }} -p MainPID --value)" = {{ pki_process.stdout | quote }}
                {% if pki_cursor.stdout | trim %}
                journalctl -u {{ pki_service | quote }} --after-cursor={{ (pki_cursor.stdout | regex_findall('-- cursor: (.+)') | first) | quote }} --no-pager -o cat
                {% endif %}
              register: pki_verified
              changed_when: false
              until: >-
                pki_verified.rc == 0 and (not pki_cursor.stdout | trim or
                ('refreshed from disk' in pki_verified.stdout and
                (pki_certificate.stdout | regex_findall('(?i)fingerprint[": ]+([a-f0-9]+)') | first) in pki_verified.stdout))
              failed_when: >-
                pki_verified.rc != 0 or 'Could not load client cert' in pki_verified.stdout or
                'Failed to load ca from config' in pki_verified.stdout
              retries: 10
              delay: 1
      rescue:
        - name: Restore PKI after failed activation
          include_tasks: pki_restore.yml
          when: not pki_in_place | default(false) and pki_backup.path is defined
        - name: Stop after failed PKI activation
          fail:
            msg: >-
              PKI installation or activation failed at '{{ ansible_failed_task.name | default('unknown task', true) }}':
              {{ 'details hidden by no_log' if ((ansible_failed_task.no_log | default(false, true) | bool) or (ansible_failed_result._ansible_no_log | default(false) | bool)) else
              (([ansible_failed_result.stderr | default(''), ansible_failed_result.module_stderr | default(''), ansible_failed_result.stdout | default(''), ansible_failed_result.module_stdout | default(''), ansible_failed_result.msg | default('')] | map('trim') | select | first | default('no diagnostic output', true)).splitlines() | last | truncate(300)) }}.
              The pre-run files were restored where available.
      always:
        - name: Remove transaction backup
          file: {path: "{{ pki_backup.path }}", state: absent}
          changed_when: false
          no_log: true
          when: not pki_in_place | default(false) and pki_backup.path is defined
