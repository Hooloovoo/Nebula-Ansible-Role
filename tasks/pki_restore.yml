---
# Restore the current transaction's snapshot, without creating another snapshot.
# The caller owns reporting the original failure and cleaning up pki_backup.path.
- name: Restore PKI snapshot
  become: true
  vars:
    pki_service: "{{ 'lighthouse' if inventory_hostname in groups['nebula_lighthouse'] else 'nebula' }}"
  when: not ansible_check_mode and pki_backup.path is defined
  block:
    - name: Restore original PKI files and metadata
      command:
        argv: [cp, -p, '--', "{{ pki_backup.path }}/{{ item.item }}", "{{ nebula_config_dir }}/{{ item.item }}"]
      loop: "{{ pki_before.results }}"
      no_log: true
      when: item.stat.exists and item.item in pki_changed

    - name: Remove files absent before the transaction
      file:
        path: "{{ nebula_config_dir }}/{{ item.item }}"
        state: absent
      loop: "{{ pki_before.results }}"
      no_log: true
      when: not item.stat.exists

    - name: Reactivate restored PKI
      systemd:
        name: "{{ pki_service }}"
        state: "{{ 'restarted' if pki_activation_attempted and pki_activation == 'restarted' else 'reloaded' }}"

    - name: Verify restored process identity
      shell: |
        set -eu
        {% if pki_activation_attempted and pki_activation == 'restarted' %}
        test "$(systemctl is-active {{ pki_service | quote }})" = active
        test "$(systemctl show {{ pki_service | quote }} -p MainPID --value)" -gt 0
        {% else %}
        test "$(systemctl is-active {{ pki_service | quote }}; systemctl show {{ pki_service | quote }} -p MainPID --value)" = {{ pki_process.stdout | quote }}
        {% endif %}
      changed_when: false

    - name: Verify restored tunnel addresses
      command:
        argv: [ip, -json, address, show, dev, "{{ pki_tun_device }}"]
      register: pki_restored_addresses
      changed_when: false
      until: >-
        pki_restored_addresses.rc == 0 and
        pki_original_networks | difference(pki_restored_addresses.stdout | from_json |
        json_query("[].addr_info[].join('/', [local, to_string(prefixlen)])")) | length == 0
      retries: 5
      delay: 1
      when: not pki_tun_disabled
