- name: Sign and install node PKI
  vars:
    pki_in_place: "{{ inventory_hostname == nebula_ca_host }}"
    pki_names: ["{{ inventory_hostname }}.crt", "{{ inventory_hostname }}.key", ca.crt]
    pki_files: "{{ lighthouse_files.results }}"
  block:
    - name: Snapshot live PKI before signing on this node
      include_tasks: pki_snapshot.yml
      when: pki_in_place
    - name: Sign certificate on lighthouse and fetch cert/key/CA
      include_tasks: sign.yml
    - name: Ensure node has hosts file entry for lighthouse
      lineinfile:
        path: /etc/hosts
        line: "{{ nebula_lighthouse_internal_ip_addr }} {{ nebula_lighthouse_hostname }}.neb"
      when: nebula_node_lighthouse_in_hosts_file
    - name: Install node PKI
      include_tasks: install_pki.yml
  rescue:
    - name: Restore live PKI after signing or activation failure
      include_tasks: pki_restore.yml
      when: pki_in_place and pki_backup.path is defined
    - name: Stop after failed node PKI update
      fail:
        msg: >-
          Node PKI update failed at '{{ ansible_failed_task.name | default('unknown task', true) }}':
          {{ 'details hidden by no_log' if ((ansible_failed_task.no_log | default(false, true) | bool) or (ansible_failed_result._ansible_no_log | default(false) | bool)) else
          (([ansible_failed_result.stderr | default(''), ansible_failed_result.module_stderr | default(''), ansible_failed_result.stdout | default(''), ansible_failed_result.module_stdout | default(''), ansible_failed_result.msg | default('')] | map('trim') | select | first | default('no diagnostic output', true)).splitlines() | last | truncate(300)) }}.
          Previous live PKI was restored where available.
  always:
    - name: Remove signing snapshot
      become: true
      file: {path: "{{ pki_backup.path }}", state: absent}
      changed_when: false
      no_log: true
      when: pki_in_place and not ansible_check_mode and pki_backup.path is defined

- name: Ensure Nebula is configured
  template:
    src: node_config.yml.j2 
    dest: "{{ nebula_config_dir }}/config.yml"
    owner: root
    group: root
    mode: '0400'
    validate: "{{ nebula_config_dir }}/nebula -test -config %s"
  notify: restart nebula

- name: Ensure Nebula service exists
  template:
    src: node.service.j2
    dest: /etc/systemd/system/nebula.service
    owner: root
    group: root
    mode: '0644'

- name: Ensure Nebula service is enabled and running
  systemd: 
    name: nebula
    daemon_reload: yes
    enabled: yes
    masked: no
    state: started

- name: Ensure nebula-check is present
  template:
    src: nebula-check.sh.j2
    dest: "{{ nebula_config_dir }}/nebula-check.sh"
    owner: root
    group: root
    mode: '0755'
  when: nebula_install_check_cron|bool

- name: Ensure nebula-check is scheduled via cron
  cron:
    name: "nebula-check"
    minute: "{{ nebula_check_cron_minute | default('*/5') }}"
    job: "{{ nebula_config_dir }}/nebula-check.sh"
  when: nebula_install_check_cron|bool
