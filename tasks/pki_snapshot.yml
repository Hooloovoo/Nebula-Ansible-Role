---
# Initialize a new transaction's process/file metadata and discard stale facts.
# Remote backups are deferred until changed files are identified.
- name: Snapshot PKI state
  become: true
  vars:
    pki_service: "{{ 'lighthouse' if inventory_hostname in groups['nebula_lighthouse'] else 'nebula' }}"
    pki_install_names: "{{ pki_names if pki_names is defined else pki_files | map(attribute='item') | list }}"
  block:
    - name: Initialize installation state
      set_fact:
        pki_changed: []
        pki_backup: {}
        pki_process: {}
        pki_before: {}
        pki_activation: reloaded
        pki_activation_attempted: false
        pki_original_networks: []
        pki_original_unsafe_networks: []
        pki_runtime_networks: []
      no_log: true

    - name: Inspect running configuration and process
      shell: >-
        test {{ ansible_facts['system'] | quote }} = Linux && test -f {{ (nebula_config_dir ~ '/config.yml') | quote }} &&
        systemctl is-active {{ pki_service | quote }} &&
        systemctl show {{ pki_service | quote }} -p MainPID --value
      register: pki_process
      changed_when: false
      failed_when: false
      check_mode: false

    - name: Inspect original PKI metadata
      stat:
        path: "{{ nebula_config_dir }}/{{ item }}"
      loop: "{{ pki_install_names }}"
      register: pki_before
      no_log: true

    - name: Inspect PKI and tunnel before changes
      when: pki_process.rc == 0
      block:
        - name: Inspect original certificate networks
          include_tasks: pki_inspect_certificate.yml

        - name: Retain original certificate networks
          set_fact:
            pki_original_networks: "{{ pki_certificate_networks }}"
            pki_original_unsafe_networks: "{{ pki_certificate_unsafe_networks }}"

        - name: Read running configuration
          slurp:
            src: "{{ nebula_config_dir }}/config.yml"
          register: pki_original_config
          no_log: true

        - name: Identify configured tunnel
          set_fact:
            pki_tun_device: "{{ (pki_original_config.content | b64decode | from_yaml).tun.dev | default('nebula1') }}"
            pki_tun_disabled: "{{ (pki_original_config.content | b64decode | from_yaml).tun.disabled | default(false) | bool }}"
          no_log: true

        - name: Inspect current tunnel addresses
          command:
            argv: [ip, -json, address, show, dev, "{{ pki_tun_device }}"]
          register: pki_original_addresses
          changed_when: false
          check_mode: false
          when: not pki_tun_disabled

        - name: Retain current tunnel addresses
          set_fact:
            pki_runtime_networks: "{{ pki_original_addresses.stdout | from_json | json_query(\"[].addr_info[].join('/', [local, to_string(prefixlen)])\") }}"
          when: not pki_tun_disabled and pki_original_addresses.rc == 0
